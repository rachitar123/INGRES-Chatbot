databases:
  - name: ingres-postgres
    databaseName: ingres_db
    user: ingres_user
    plan: free

services:
  # ──────────────────────────────────────────────
  # 1. FastAPI Backend
  # ──────────────────────────────────────────────
  - type: web
    name: ingres-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ingres-postgres
          property: connectionString
      # Rasa is disabled — backend's pattern-matching fallback is used instead
      - key: USE_RASA
        value: "false"
      - key: RASA_SERVER_URL
        value: "http://localhost:5005"
    healthCheckPath: /health

  # ──────────────────────────────────────────────
  # 2. React Frontend (Static Site)
  # ──────────────────────────────────────────────
  - type: web
    name: ingres-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: ingres-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
